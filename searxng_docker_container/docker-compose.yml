version: '3.8'

services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml
      - ./secret_key:/etc/searxng/secret_key
    environment:
      - SEARXNG_SECRET_KEY=/etc/searxng/secret_key
    restart: unless-stopped